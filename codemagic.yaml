workflows:
  ios-no-codesign:
    name: iOS Build (No Codesign)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Package IPA for Sideloadly
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -qr CanCauCom.ipa Payload
          echo "Done: $(ls -lh CanCauCom.ipa)"

    artifacts:
      - build/ios/iphoneos/CanCauCom.ipa
